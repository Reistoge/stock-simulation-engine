services:
  db:
    image: postgres:17
    volumes: 
      - postgres-db:/var/lib/postgresql/data
    env_file:
      - ./.env
    ports:
      - 5432:5432
  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - ./.env
    ports:
      - 8080:80
    depends_on:
      - db
    volumes:
      - ./config/pgadmin/server.json:/pgadmin4/servers.json
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"

volumes:
  postgres-db: